services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    image: amigosecretoabs-php:local
    container_name: amigosecretoABS_app
    working_dir: /var/www/app
    volumes:
      - ./:/var/www/app
    networks:
      - shared
    restart: unless-stopped

  web:
    image: nginx:1.27-alpine
    container_name: amigosecretoABS_web
    depends_on:
      - app
    ports:
      - "8085:80"
    volumes:
      - ./:/var/www/app:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - shared
    restart: unless-stopped

networks:
  shared:
    external: true
    name: shared_net
