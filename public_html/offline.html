<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#4f46e5">
    <title>Sem conexão | Amigo Secreto ABS</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: #f3f4f6;
            color: #111827;
            font: 1rem/1.5 system-ui, sans-serif;
        }

        main {
            box-sizing: border-box;
            width: min(90%, 28rem);
            padding: 2rem;
            border-radius: 1rem;
            background: white;
            text-align: center;
            box-shadow: 0 8px 24px #11182715;
        }

        img { border-radius: 1rem; }
        h1 { margin: .75rem 0 .5rem; font-size: 1.75rem; }
        p { margin: 0 0 1.5rem; color: #374151; }

        button {
            padding: .75rem 1.25rem;
            border: 0;
            border-radius: .5rem;
            background: #4f46e5;
            color: white;
            font: inherit;
            font-weight: 600;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <main>
        <img src="/images/pwa-icon-192.png" alt="Amigo Secreto ABS" width="80" height="80">
        <h1>Você está sem conexão</h1>
        <p>Conecte-se à internet para acessar seus grupos e sorteios.</p>
        <button type="button" id="retry">Tentar novamente</button>
    </main>
    <script>
        document.getElementById('retry').addEventListener('click', () => window.location.reload());
    </script>
</body>
</html>
